name: Build Windows Installer

on:
  push:
    branches:
      - claude/windows-task-organizer-0wgq7l
    paths:
      - "app/**"
      - "launcher.py"
      - "requirements.txt"
      - "packaging/**"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build TaskOrganizer.exe with PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/task_organizer.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskOrganizer-Setup
          path: packaging/output/TaskOrganizer-Setup.exe
          if-no-files-found: error
